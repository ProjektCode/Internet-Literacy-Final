<article class="post-card">
  <p class="card-eyebrow">{{ include.post.categories | join: " • " }}</p>
  <h3>
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
  </h3>
  <p>{{ include.post.excerpt | strip_html | truncate: 160 }}</p>
  <div class="card-meta">{{ include.post.date | date: "%b %-d, %Y" }}</div>
</article>
