---
layout: default
---

<article class="post-content prose">
  <header class="post-header">
    <p class="eyebrow">{{ page.categories | join: " • " }}</p>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
      {% if page.author %}
        <span>• {{ page.author }}</span>
      {% endif %}
    </div>
  </header>

  {{ content }}
</article>
